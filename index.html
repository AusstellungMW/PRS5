<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#eaf7ff">

  <title>Parcours auf dem Parkplatz</title>

  <style>
    @font-face {
      font-family: "Futura LT";
      src:
        url("fonts/FuturaLT.woff2") format("woff2"),
        url("fonts/FuturaLT.ttf") format("truetype"),
        url("fonts/FuturaLT.otf") format("opentype");
      font-style: normal;
      font-weight: 100 900;
      font-display: swap;
    }

    :root {
      --blue: #008fc9;
      --blue-dark: #075986;
      --white-soft: rgba(255, 255, 255, 0.91);
      --text: #17384c;
      --shadow: 0 14px 36px rgba(15, 69, 102, 0.16);
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      font-family: "Futura LT", Futura, Arial, sans-serif;
      background-color: #f7fcff;
      background-image: url("BGPRS.png");
      background-repeat: no-repeat;
      background-position: center top;
      background-size: cover;
    }

    .page {
      width: min(1180px, calc(100% - 32px));
      margin: 0 auto;
      padding: 24px 0 48px;
    }

    .header {
      display: grid;
      grid-template-columns: 150px minmax(0, 1fr) 150px;
      align-items: start;
      gap: 18px;
      margin-bottom: 28px;
    }

    .school-logo {
      display: block;
      width: 138px;
      max-width: 100%;
      height: auto;
      object-fit: contain;
      filter: drop-shadow(0 5px 10px rgba(0, 70, 110, 0.12));
    }

    .title-area {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 16px;
      min-width: 0;
      padding-top: 10px;
    }

    h1 {
      margin: 0;
      max-width: 780px;
      color: var(--blue-dark);
      font-size: clamp(1.65rem, 3.3vw, 3rem);
      line-height: 1.12;
      text-align: center;
      text-wrap: balance;
    }

    .audio-button {
      position: fixed;
      top: calc(14px + env(safe-area-inset-top));
      right: calc(14px + env(safe-area-inset-right));
      z-index: 1000;
      flex: 0 0 auto;
      width: clamp(82px, 9vw, 118px);
      height: clamp(82px, 9vw, 118px);
      padding: 0;
      border: 0;
      background: transparent;
      cursor: pointer;
      animation: alarm-nudge 3s ease-in-out infinite;
      transform-origin: 50% 55%;
      transition: transform 160ms ease;
      -webkit-tap-highlight-color: transparent;
    }

    .audio-button:hover {
      transform: scale(1.03);
    }

    .audio-button:focus-visible {
      outline: 4px solid #ffb51b;
      outline-offset: 4px;
      border-radius: 12px;
    }

    .audio-button.playing {
      animation-play-state: paused;
      transform: scale(1.05);
    }

    .audio-button img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      pointer-events: none;
      filter: drop-shadow(0 6px 12px rgba(0, 84, 135, 0.16));
    }

    @keyframes alarm-nudge {
      0%, 89%, 100% {
        transform: rotate(0deg) scale(1);
      }
      91% {
        transform: rotate(-5deg) scale(1.03);
      }
      93% {
        transform: rotate(5deg) scale(1.03);
      }
      95% {
        transform: rotate(-4deg) scale(1.03);
      }
      97% {
        transform: rotate(4deg) scale(1.03);
      }
      99% {
        transform: rotate(0deg) scale(1);
      }
    }

    .photo-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 26px;
      align-items: stretch;
    }

    .exhibit-card {
      overflow: hidden;
      display: flex;
      flex-direction: column;
      border: 4px solid var(--blue-dark);
      border-radius: 22px;
      background: var(--white-soft);
      box-shadow: var(--shadow);
      backdrop-filter: blur(3px);
    }

    .photo-wrap {
      position: relative;
      overflow: hidden;
      background: #dbeefa;
    }

    .photo-wrap img {
      display: block;
      width: 100%;
      height: auto;
    }

    .card-text {
      flex: 1;
      padding: 22px 24px 26px;
      text-align: center;
    }

    .card-text p {
      margin: 0;
      font-size: clamp(1.08rem, 1.75vw, 1.3rem);
      line-height: 1.55;
    }

    .card-text p + p {
      margin-top: 8px;
    }

    .card-text strong {
      color: var(--blue-dark);
      font-weight: 700;
    }

    @media (max-width: 820px) {
      .page {
        width: min(100% - 22px, 720px);
        padding-top: 14px;
      }

      .header {
        grid-template-columns: 92px minmax(0, 1fr);
        gap: 12px;
        margin-bottom: 20px;
        padding-right: 88px;
      }

      .school-logo {
        width: 86px;
      }

      .title-area {
        justify-content: flex-start;
        gap: 10px;
        padding-top: 2px;
      }

      h1 {
        text-align: left;
        font-size: clamp(1.18rem, 4.7vw, 1.78rem);
        line-height: 1.08;
      }

      .audio-button {
        width: 76px;
        height: 76px;
      }

      .photo-grid {
        grid-template-columns: 1fr;
        gap: 22px;
      }

    }

    @media (max-width: 440px) {
      .header {
        grid-template-columns: 70px minmax(0, 1fr);
        padding-right: 76px;
      }

      .school-logo {
        width: 66px;
      }

      .title-area {
        align-items: flex-start;
      }

      .audio-button {
        width: 68px;
        height: 68px;
      }

      .card-text {
        padding: 18px 16px 22px;
      }
    }
  </style>
</head>

<body>
  <main class="page">
    <header class="header">
      <img
        class="school-logo"
        src="LogoPRS.png"
        alt="Peter-Räuber-Schule Wolfenbüttel"
      >

      <div class="title-area">
        <h1>Parcours auf dem Parkplatz</h1>

        <button
          id="audioButton"
          class="audio-button"
          type="button"
          aria-label="Text anhören"
          aria-pressed="false"
          title="Text anhören"
        >
          <img src="LSPRS.png" alt="">
        </button>
      </div>

      <div aria-hidden="true"></div>
    </header>

    <section class="photo-grid">
      <article class="exhibit-card">
        <div class="photo-wrap">
          <img
            src="5A.jpg"
            alt="Früher: Mitarbeiter:innenparkplatz, Mitarbeiter:innen und Schüler:innen"
          >
        </div>

        <div class="card-text">
          <p><strong>Früher:</strong> Mitarbeiter:innenparkplatz, Mitarbeiter:innen und Schüler:innen</p>
          <p>Fotografie: 1996</p>
        </div>
      </article>

      <article class="exhibit-card">
        <div class="photo-wrap">
          <img
            src="5B.jpg"
            alt="Heute: Mitarbeiter:innenparkplatz, Frau Giese (Lehrerin), Benjamin und Max"
          >
        </div>

        <div class="card-text">
          <p><strong>Heute:</strong> Mitarbeiter:innenparkplatz, Frau Giese (Lehrerin), Benjamin und Max</p>
          <p>Fotografie: 2026</p>
        </div>
      </article>
    </section>

    <audio id="narration" preload="metadata">
      <source src="5.mp3" type="audio/mpeg">
    </audio>
  </main>

  <script>
    const audio = document.getElementById("narration");
    const button = document.getElementById("audioButton");

    function setPlayingState(isPlaying) {
      button.classList.toggle("playing", isPlaying);
      button.setAttribute("aria-pressed", String(isPlaying));
      button.setAttribute(
        "aria-label",
        isPlaying ? "Audiowiedergabe stoppen" : "Text anhören"
      );
      button.title = isPlaying ? "Stopp" : "Text anhören";
    }

    button.addEventListener("click", async () => {
      try {
        if (!audio.paused) {
          audio.pause();
          audio.currentTime = 0;
          setPlayingState(false);
          return;
        }

        audio.currentTime = 0;
        await audio.play();
        setPlayingState(true);
      } catch (error) {
        setPlayingState(false);
        console.error("5.mp3 konnte nicht gestartet werden.", error);
      }
    });

    audio.addEventListener("ended", () => {
      audio.currentTime = 0;
      setPlayingState(false);
    });

    audio.addEventListener("error", () => {
      setPlayingState(false);
      console.error("5.mp3 wurde nicht gefunden oder kann nicht abgespielt werden.");
    });
  </script>
</body>
</html>
